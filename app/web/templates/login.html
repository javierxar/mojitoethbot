<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>Ingresar · ETH DGT Bot</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="auth">
    <form class="card auth-card" method="post" action="/login">
      <div class="brand">
        <span class="brand-logo">
          <svg width="18" height="18" viewBox="9 4 15 24" aria-hidden="true"><g fill="#fff">
            <path fill-opacity=".6" d="M16.498 4v8.87l7.497 3.35z"/><path d="M16.498 4L9 16.22l7.498-3.35z"/>
            <path fill-opacity=".6" d="M16.498 21.968v6.027L24 17.616z"/><path d="M16.498 27.995v-6.028L9 17.616z"/>
            <path fill-opacity=".2" d="M16.498 20.573l7.497-4.353-7.497-3.348z"/><path fill-opacity=".6" d="M9 16.22l7.498 4.353v-7.701z"/>
          </g></svg>
        </span>
        <span>
          <div class="brand-name">eth<span>dgt</span> bot</div>
          <div class="brand-sub">Ingresá para ver tu bot</div>
        </span>
      </div>
      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="height:44px; margin-top:0.4rem;">Ingresar</button>
    </form>
  </div>
</body>
</html>
